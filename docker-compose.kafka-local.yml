version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_batch_postgres
    environment:
      POSTGRES_DB: bank_batch
      POSTGRES_USER: bank_batch
      POSTGRES_PASSWORD: bank_batch
    ports:
      - "5432:5432"
    volumes:
      - bank_batch_pgdata:/var/lib/postgresql/data

  # Broker de eventos (Semana 7 - Exp3): un unico nodo Kafka en modo KRaft
  # (sin Zookeeper), suficiente para el entorno de desarrollo/evidencia.
  # Topico usado: "movimiento-registrado" (ms-movimientos -> ms-transacciones).
  kafka:
    image: apache/kafka:3.7.0
    container_name: bank_batch_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - bank_batch_kafkadata:/var/lib/kafka/data

volumes:
  bank_batch_pgdata:
  bank_batch_kafkadata:
